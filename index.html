<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Frame Rate Stabilizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #canvas-wrapper {
      position: relative;
      flex: 1 1 0;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 10px 14px;
      line-height: 2;
      font-size: 13px;
      pointer-events: none;
      min-width: 160px;
    }

    #controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #1a1a22;
      border-top: 1px solid #333;
    }

    #controls span {
      font-size: 13px;
      color: #aaa;
    }

    #controls button {
      padding: 6px 20px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2a2a35;
      color: #ccc;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    #controls button.active {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
    }

    #controls button:hover:not(.active) {
      background: #3a3a48;
      border-color: #777;
    }
  </style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
  </div>
  <div id="controls"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
